name: CI/CD Food Delivery

on:
  push:
    branches: [ "main", "master" ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # 1. АВТОРИЗАЦИЯ В DOCKER REGISTRY (ОСТАВЛЯЕМ КАК БЫЛО, НО ИСПОЛЬЗУЕМ SA_KEY)
      # Внимание: Если Docker тоже требует JSON-ключ, а не OAuth, 
      # лучше использовать экшен yc-actions/yc-cr-login@v3 (см. комментарий ниже).
      # Пока оставляем ваш вариант, если он работает.
      - name: Log in to Yandex Container Registry
        run: |
          # ВНИМАНИЕ: Если вы удалили YANDEX_OAUTH_TOKEN, этот шаг упадет.
          # Для JSON-ключа используйте yc-actions/yc-cr-login@v3 
          # (пример в конце файла в комментариях).
          echo "${{ secrets.YANDEX_OAUTH_TOKEN }}" | docker login --username iam --password-stdin cr.yandex

      # 2. СБОРКА С ПРАВИЛЬНЫМ КОНТЕКСТОМ
      - name: Build and Push Catalog Service Image
        run: |
          # Ищем Dockerfile
          DOCKERFILE_PATH=$(find . -type f -iname "Dockerfile*" | grep -i "catalog" | head -n 1)
          
          if [ -z "$DOCKERFILE_PATH" ]; then
            echo "::error::Dockerfile для Catalog не найден"
            exit 1
          fi
          
          echo "Found Dockerfile at: $DOCKERFILE_PATH"
          
          IMAGE=cr.yandex/${{ secrets.YC_REGISTRY_ID }}/catalog-service
          
          # КРИТИЧНО: Передаем точку (.) как контекст, потому что Dockerfile ищет пути от корня!
          docker build \
            -f "$DOCKERFILE_PATH" \
            -t "$IMAGE:latest" \
            -t "$IMAGE:${GITHUB_SHA::7}" \
            .
            
          docker push "$IMAGE:latest"
          docker push "$IMAGE:${GITHUB_SHA::7}"

      # 3. ДЕПЛОЙ В KUBERNETES С ИСПОЛЬЗОВАНИЕМ PYTHON ДЛЯ JWT
      - name: Deploy to Yandex Kubernetes
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBE_CONFIG }}" > ~/.kube/config
          chmod 600 ~/.kube/config
          
          echo "Генерируем JWT и получаем IAM токен через Python..."
          
          # Устанавливаем библиотеки для работы с JWT
          pip install pyjwt cryptography --quiet
          
          # Сохраняем JSON-ключ во временный файл
          echo '${{ secrets.YANDEX_SA_KEY }}' > /tmp/sa_key.json
          
          # Запускаем Python-скрипт для получения IAM-токена
          IAM_TOKEN=$(python3 -c "
          import json, time, jwt
          from cryptography.hazmat.primitives import serialization
          
          with open('/tmp/sa_key.json') as f:
              key_data = json.load(f)
          
          private_key = serialization.load_pem_private_key(
              key_data['private_key'].encode(),
              password=None
          )
          
          now = int(time.time())
          payload = {
              'aud': 'https://iam.api.cloud.yandex.net/iam/v1/tokens',
              'iss': key_data['service_account_id'],
              'iat': now,
              'exp': now + 3600
          }
          
          encoded_jwt = jwt.encode(
              payload,
              private_key,
              algorithm='PS256',
              headers={'kid': key_data['id']}
          )
          print(encoded_jwt)
          ")

          if [ -z "$IAM_TOKEN" ] || [ "$IAM_TOKEN" == "null" ]; then
            echo "::error::Не удалось сгенерировать JWT. Проверьте секрет YANDEX_SA_KEY."
            exit 1
          fi

          # Обмениваем JWT на IAM-токен
          RESPONSE=$(curl -s -X POST \
            -H "Content-Type: application/json" \
            -d "{\"jwt\":\"$IAM_TOKEN\"}" \
            "https://iam.api.cloud.yandex.net/iam/v1/tokens")
            
          IAM_TOKEN=$(echo "$RESPONSE" | jq -r '.iamToken')
          
          if [ -z "$IAM_TOKEN" ] || [ "$IAM_TOKEN" == "null" ]; then
            echo "::error::Не удалось получить IAM токен. Ответ API: $RESPONSE"
            exit 1
          fi
          
          echo "IAM токен успешно получен."

          # Подставляем токен в kubeconfig
          kubectl config set-credentials yc-managed-k8s-catsfnq8kgbvpv5eg4cu --token="$IAM_TOKEN"
          kubectl config set-context yc-k8s-cluster-production --user=yc-managed-k8s-catsfnq8kgbvpv5eg4cu

          # Применяем манифест инфраструктуры
          echo "Применяем манифесты..."
          kubectl apply -f ${{ github.workspace }}/deployments/k8s/kubernetes/infrastructure.yaml