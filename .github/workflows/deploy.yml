name: CI/CD Food Delivery

on:
  push:
    branches: [ "main", "master" ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # 1. АВТОРИЗАЦИЯ (проверьте тип токена!)
      - name: Log in to Yandex Container Registry
        run: |
          # Если в секрете IAM-токен (до 12 часов) — используйте iam
          # Если OAuth-токен — замените iam на oauth
          echo "${{ secrets.YANDEX_OAUTH_TOKEN }}" | docker login --username iam --password-stdin cr.yandex

      # 2. СБОРКА С ПРАВИЛЬНЫМ КОНТЕКСТОМ
      - name: Build and Push Catalog Service Image
        run: |
          # Ищем любой файл, начинающийся на Dockerfile (Dockerfile.dev и т.п.)
          DOCKERFILE_PATH=$(find . -type f -iname "Dockerfile*" | grep -i "catalog" | head -n 1)

          if [ -z "$DOCKERFILE_PATH" ]; then
            echo "::error::Dockerfile для Catalog не найден"
            exit 1
          fi

          echo "Found Dockerfile at: $DOCKERFILE_PATH"

          # КРИТИЧНО: контекст = папка, где лежит Dockerfile (или выше, см. COPY в файле)
          CONTEXT_DIR=$(dirname "$DOCKERFILE_PATH")
          echo "Build context: $CONTEXT_DIR"

          IMAGE=cr.yandex/${{ secrets.YC_REGISTRY_ID }}/catalog-service

          # Собираем с тегом latest и коротким SHA для отката
          docker build \
            -f "$DOCKERFILE_PATH" \
            -t "$IMAGE:latest" \
            -t "$IMAGE:${GITHUB_SHA::7}" \
            .
          docker push "$IMAGE:latest"
          docker push "$IMAGE:${GITHUB_SHA::7}"

      # 3. ДЕПЛОЙ (добавлен сам сервис, не только инфраструктура)
      - name: Deploy to Yandex Kubernetes
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBE_CONFIG }}" > ~/.kube/config
          chmod 600 ~/.kube/config

          # 1. Сохраняем ключ сервисного аккаунта из секретов GitHub в файл
          echo '${{ secrets.YANDEX_SA_KEY }}' > sa-key.json

          # 2. Скачиваем официальную легковесную утилиту yc для Linux прямо в пайплайн
          curl -sSL https://yandexcloud.net | bash -s -- -b ~/.yc/bin
          export PATH=$PATH:$HOME/.yc/bin

          # 3. Авторизуем утилиту yc по созданному ключу сервисного аккаунта
          yc config profile create sa-profile
          yc config set service-account-key sa-key.json

          # 4. Генерируем свежий рабочий токен авторизации Кубернетиса
          IAM_TOKEN=$(yc iam create-token)

          # 5. Привязываем полученный токен к пользователю кластера
          kubectl config set-credentials yc-managed-k8s-catsfnq8kgbvpv5eg4cu --token="$IAM_TOKEN"
          kubectl config set-context yc-k8s-cluster-production --user=yc-managed-k8s-catsfnq8kgbvpv5eg4cu

          # 6. Применяем манифест инфраструктуры в безопасном режиме валидации
          echo "Применяем манифесты..."
          kubectl apply -f ${{ github.workspace }}/deployments/k8s/kubernetes/infrastructure.yaml --dry-run=client