name: CI/CD Food Delivery

on:
  push:
    branches: [ "main", "master" ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # 1. АВТОРИЗАЦИЯ В DOCKER REGISTRY (через сервисный аккаунт)
      - name: Log in to Yandex Container Registry
        uses: yc-actions/yc-cr-login@v3
        with:
          yc-sa-json-credentials: ${{ secrets.YANDEX_SA_KEY }}

      # 2. СБОРКА И ПУШ ОБРАЗА CATALOGS
      - name: Build and Push Catalogs Service Image
        run: |
          DOCKERFILE_PATH=$(find ./src/Services/Catalogs -maxdepth 1 -type f -name "Dockerfile" | head -n 1)
          
          if [ -z "$DOCKERFILE_PATH" ]; then
            echo "::error::Dockerfile для Catalogs не найден"
            exit 1
          fi
          
          echo "Found Catalogs Dockerfile at: $DOCKERFILE_PATH"
          
          IMAGE=cr.yandex/${{ secrets.YC_REGISTRY_ID }}/catalog-service
          
          docker build -f "$DOCKERFILE_PATH" -t "$IMAGE:latest" -t "$IMAGE:${GITHUB_SHA::7}" .
          docker push "$IMAGE:latest"
          docker push "$IMAGE:${GITHUB_SHA::7}"

      # 3. СБОРКА И ПУШ ОБРАЗА IDENTITY (НОВЫЙ ШАГ)
      - name: Build and Push Identity Service Image
        run: |
          DOCKERFILE_PATH=$(find ./src/Services/Identity -maxdepth 1 -type f -name "Dockerfile" | head -n 1)
          
          if [ -z "$DOCKERFILE_PATH" ]; then
            echo "::error::Dockerfile для Identity не найден"
            exit 1
          fi
          
          echo "Found Identity Dockerfile at: $DOCKERFILE_PATH"
          
          IMAGE=cr.yandex/${{ secrets.YC_REGISTRY_ID }}/identity-service
          
          docker build -f "$DOCKERFILE_PATH" -t "$IMAGE:latest" -t "$IMAGE:${GITHUB_SHA::7}" .
          docker push "$IMAGE:latest"
          docker push "$IMAGE:${GITHUB_SHA::7}"

      # 4. ДЕПЛОЙ В KUBERNETES
      - name: Deploy to Yandex Kubernetes
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBE_CONFIG }}" > ~/.kube/config
          chmod 600 ~/.kube/config
          
          echo "Генерируем JWT и получаем IAM токен через Python..."
          pip install pyjwt cryptography --quiet
          echo '${{ secrets.YANDEX_SA_KEY }}' > /tmp/sa_key.json
          
          IAM_TOKEN=$(python3 -c "
          import json, time, jwt
          from cryptography.hazmat.primitives import serialization
          with open('/tmp/sa_key.json') as f:
              key_data = json.load(f)
          private_key = serialization.load_pem_private_key(key_data['private_key'].encode(), password=None)
          now = int(time.time())
          payload = {'aud': 'https://iam.api.cloud.yandex.net/iam/v1/tokens', 'iss': key_data['service_account_id'], 'iat': now, 'exp': now + 3600}
          print(jwt.encode(payload, private_key, algorithm='PS256', headers={'kid': key_data['id']}))
          ")

          RESPONSE=$(curl -s -X POST -H "Content-Type: application/json" -d "{\"jwt\":\"$IAM_TOKEN\"}" "https://iam.api.cloud.yandex.net/iam/v1/tokens")
          IAM_TOKEN=$(echo "$RESPONSE" | jq -r '.iamToken')
          
          if [ -z "$IAM_TOKEN" ] || [ "$IAM_TOKEN" == "null" ]; then
            echo "::error::Не удалось получить IAM токен. Ответ API: $RESPONSE"
            exit 1
          fi
          
          kubectl config set-credentials yc-managed-k8s-catsfnq8kgbvpv5eg4cu --token="$IAM_TOKEN"
          kubectl config set-context yc-k8s-cluster-production --user=yc-managed-k8s-catsfnq8kgbvpv5eg4cu

          echo "Переходим в папку с манифестами..."
          cd ${{ github.workspace }}/deployments/k8s/kubernetes/
          
          # Создаем namespace
          chmod +x kubectl
          ./kubectl apply -f namespaces.yaml
          
          # Подготавливаем инфраструктуру
          sed -e 's/\${ENVIRONMENT:-dev}/dev/g' \
              -e 's/\${RABBITMQ_PORT:-5672}/5672/g' \
              -e 's/\${RABBITMQ_API_PORT:-15672}/15672/g' \
              -e 's/\${RABBITMQ_HOST_PORT:-5672}/5672/g' \
              -e 's/\${RABBITMQ_HOST_API_PORT:-15672}/15672/g' \
              -e 's/\${MONGO_PORT:-27017}/27017/g' \
              -e 's/\${MONGO_HOST_PORT:-27017}/27017/g' \
              -e 's/\${MONGO_USER:-admin}/admin/g' \
              -e 's/\${MONGO_PASS:-admin}/admin/g' \
              infrastructure.yaml > infrastructure_fixed.yaml
          kubectl apply -f infrastructure_fixed.yaml --validate=false || true

          # Применяем базы данных
          kubectl apply -f postgres-deploy.yaml
          kubectl apply -f redis-deploy.yaml
          
          # Применяем сервисы
          kubectl apply -f catalogs-deploy.yaml
          # Применяем Identity (убедитесь, что файл identity-deploy.yaml создан!)
          kubectl apply -f identity-deploy.yaml
          
          # Ждем обновления подов
          kubectl rollout status deployment/catalogs-api-deployment -n food-delivery --timeout=120s
          kubectl rollout status deployment/identity-api-deployment -n food-delivery --timeout=120s