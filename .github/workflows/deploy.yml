name: CI/CD Food Delivery

on:
  push:
    branches: [ "main", "master" ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.GITHUB_TOKEN }}

      # Принудительная инициализация сабмодулей (на случай, если checkout не справился)
      - name: Init submodules manually
        run: |
          git submodule update --init --recursive

      # Диагностика: проверяем, что папка Shared на месте
      - name: Debug - Check Shared folder
        run: |
          echo "=== Checking src/Services/Shared ==="
          ls -la src/Services/Shared/ || echo "Shared folder not found or empty"

      # 1. АВТОРИЗАЦИЯ В DOCKER REGISTRY ЯНДЕКСА
      - name: Login to Yandex Container Registry
        uses: yc-actions/yc-cr-login@v3
        with:
          yc-sa-json-credentials: ${{ secrets.YANDEX_SA_KEY }}

      # 2. СБОРКА И ПУШ ОБРАЗА
      - name: Build and Push Catalog Service Image
        run: |
          DOCKERFILE_PATH=$(find . -type f -iname "Dockerfile*" | grep -i "catalog" | head -n 1)

          if [ -z "$DOCKERFILE_PATH" ]; then
            echo "::error::Dockerfile для Catalog не найден"
            exit 1
          fi

          echo "Found Dockerfile at: $DOCKERFILE_PATH"
          CONTEXT_DIR=$(dirname "$DOCKERFILE_PATH")
          echo "Build context: $CONTEXT_DIR"

          IMAGE=cr.yandex/${{ secrets.YC_REGISTRY_ID }}/catalog-service

          docker build \
            -f "$DOCKERFILE_PATH" \
            -t "$IMAGE:latest" \
            -t "$IMAGE:${GITHUB_SHA::7}" \
            "$CONTEXT_DIR"

          docker push "$IMAGE:latest"
          docker push "$IMAGE:${GITHUB_SHA::7}"

      # 3. ДЕПЛОЙ В KUBERNETES
      - name: Deploy to Yandex Kubernetes
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBE_CONFIG }}" > ~/.kube/config
          chmod 600 ~/.kube/config

          echo "Получаем IAM токен из ключа сервисного аккаунта..."
          
          # Извлекаем данные из JSON-ключа
          SA_ID=$(echo '${{ secrets.YANDEX_SA_KEY }}' | jq -r '.service_account_id')
          KEY_ID=$(echo '${{ secrets.YANDEX_SA_KEY }}' | jq -r '.id')
          PRIVATE_KEY=$(echo '${{ secrets.YANDEX_SA_KEY }}' | jq -r '.private_key')
          
          # Генерируем JWT
          HEADER=$(echo -n '{"alg":"PS256","typ":"JWT","kid":"'$KEY_ID'"}' | base64 -w 0 | tr '+/' '-_' | tr -d '=')
          NOW=$(date +%s)
          EXP=$((NOW + 3600))
          PAYLOAD=$(echo -n '{"iss":"'$SA_ID'","aud":"https://iam.api.cloud.yandex.net/iam/v1/tokens","iat":'$NOW',"exp":'$EXP'}' | base64 -w 0 | tr '+/' '-_' | tr -d '=')
          
          SIGNING_INPUT="$HEADER.$PAYLOAD"
          SIGNATURE=$(echo -n "$SIGNING_INPUT" | openssl dgst -sha256 -sign <(echo -e "$PRIVATE_KEY") | base64 -w 0 | tr '+/' '-_' | tr -d '=')
          
          JWT="$SIGNING_INPUT.$SIGNATURE"
          
          # Меняем JWT на IAM-токен
          RESPONSE=$(curl -s -X POST \
            -H "Content-Type: application/json" \
            -d "{\"jwt\":\"$JWT\"}" \
            "https://iam.api.cloud.yandex.net/iam/v1/tokens")
            
          IAM_TOKEN=$(echo "$RESPONSE" | jq -r '.iamToken')
          
          if [ -z "$IAM_TOKEN" ] || [ "$IAM_TOKEN" == "null" ]; then
            echo "::error::Не удалось получить IAM токен. Ответ: $RESPONSE"
            exit 1
          fi
          
          echo "IAM токен успешно получен."

          # Подставляем токен в kubeconfig
          kubectl config set-credentials yc-managed-k8s-catsfnq8kgbvpv5eg4cu --token="$IAM_TOKEN"
          kubectl config set-context yc-k8s-cluster-production --user=yc-managed-k8s-catsfnq8kgbvpv5eg4cu

          # Применяем манифест инфраструктуры
          echo "Применяем манифесты..."
          kubectl apply -f ${{ github.workspace }}/deployments/k8s/kubernetes/infrastructure.yaml