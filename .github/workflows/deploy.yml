name: CI/CD Food Delivery

on:
  push:
    branches: [ "main", "master" ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # 1. АВТОРИЗАЦИЯ В ЯНДЕКС ОБЛАКЕ ЧЕРЕЗ СЕРВИСНЫЙ АККАУНТ
      # Этот шаг получает IAM-токен из вашего key.json (секрет YANDEX_SA_KEY)
      # и сохраняет его в переменную окружения YC_IAM_TOKEN
      - name: Authenticate to Yandex Cloud
        id: auth
        uses: yandex-cloud/yc-actions/auth@v1
        with:
          service-account-key: ${{ secrets.YANDEX_SA_KEY }}

      # 2. АВТОРИЗАЦИЯ В DOCKER REGISTRY
      # Используем полученный IAM-токен для входа в реестр
      - name: Log in to Yandex Container Registry
        run: |
          echo "${{ steps.auth.outputs.iam-token }}" | docker login --username iam --password-stdin cr.yandex

      # 3. СБОРКА И ПУШ ОБРАЗА
      - name: Build and Push Catalog Service Image
        run: |
          DOCKERFILE_PATH=$(find . -type f -iname "Dockerfile*" | grep -i "catalog" | head -n 1)

          if [ -z "$DOCKERFILE_PATH" ]; then
            echo "::error::Dockerfile для Catalog не найден"
            exit 1
          fi

          echo "Found Dockerfile at: $DOCKERFILE_PATH"
          CONTEXT_DIR=$(dirname "$DOCKERFILE_PATH")
          echo "Build context: $CONTEXT_DIR"

          IMAGE=cr.yandex/${{ secrets.YC_REGISTRY_ID }}/catalog-service

          docker build \
            -f "$DOCKERFILE_PATH" \
            -t "$IMAGE:latest" \
            -t "$IMAGE:${GITHUB_SHA::7}" \
            "$CONTEXT_DIR"

          docker push "$IMAGE:latest"
          docker push "$IMAGE:${GITHUB_SHA::7}"

      # 4. ДЕПЛОЙ В KUBERNETES
      - name: Deploy to Yandex Kubernetes
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBE_CONFIG }}" > ~/.kube/config
          chmod 600 ~/.kube/config

          echo "Подставляем IAM токен в kubeconfig..."
          
          # Используем токен, полученный на шаге авторизации
          kubectl config set-credentials yc-managed-k8s-catsfnq8kgbvpv5eg4cu --token="${{ steps.auth.outputs.iam-token }}"
          kubectl config set-context yc-k8s-cluster-production --user=yc-managed-k8s-catsfnq8kgbvpv5eg4cu

          # Применяем манифест инфраструктуры
          echo "Применяем манифесты..."
          kubectl apply -f ${{ github.workspace }}/deployments/k8s/kubernetes/infrastructure.yaml