name: CI/CD Food Delivery

on:
  push:
    branches: [ "main", "master" ] # Сработает автоматически при пуше

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive # Подтягиваем библиотеки BuildingBlocks

    - name: Log in to Yandex Container Registry
      run: |
        echo "${{ secrets.YANDEX_OAUTH_TOKEN }}" | docker login --username iam --password-stdin cr.yandex

    - name: Build and Push Catalog Service Image
      run: |
        # Автоматически находим нужный Dockerfile в дереве проекта, чтобы не зависеть от регистра букв
        DOCKERFILE_PATH=$(find . -iname "Dockerfile" | grep -i "Catalog.Api" | head -n 1)
        echo "Found Dockerfile at: $DOCKERFILE_PATH"
        
        # Запускаем сборку из корня проекта, передавая весь репозиторий в качестве контекста
        docker build -t cr.yandex/${{ secrets.YC_REGISTRY_ID }}/catalog-service:latest -f "$DOCKERFILE_PATH" .
        docker push cr.yandex/${{ secrets.YC_REGISTRY_ID }}/catalog-service:latest

    - name: Deploy to Yandex Kubernetes
      run: |
        # Авторизация в Кубернетисе из секретов GitHub
        mkdir -p ~/.kube
        echo "${{ secrets.KUBE_CONFIG }}" > ~/.kube/config
        
        # Разворачиваем базовую инфраструктуру (БД, брокеры сообщений) в облаке
        kubectl apply -f deployments/k8s/infrastructure.yaml