apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalogs-api-deployment
  namespace: food-delivery
  labels:
    app: catalogs-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: catalogs-api
  template:
    metadata:
      labels:
        app: catalogs-api
    spec:
      containers:
        - name: catalogs-api
          # Ваш реальный ID реестра из Yandex Cloud
          image: cr.yandex/crp1i4osjhttn3cdq6ao/catalog-service:latest
          ports:
            - containerPort: 8080
          env:
            # Окружение (Production отключает проверку DI, которая ломала запуск)
            - name: ASPNETCORE_ENVIRONMENT
              value: "Production"
            - name: ASPNETCORE_URLS
              value: "http://+:8080"

            # --- ОТКЛЮЧАЕМ ТЕЛЕМЕТРИЮ (чтобы Health Check не падал) ---
            - name: OpenTelemetryOptions__UseOTLPExporter
              value: "false"
            - name: OpenTelemetryOptions__UseAspireOTLPExporter
              value: "false"

            # --- НАСТРОЙКИ ПОДКЛЮЧЕНИЙ ---
            
            # MongoDB
            - name: MongoOptions__ConnectionString
              value: "mongodb://admin:admin@mongo-service-dev:27017/catalogs?authSource=admin&authMechanism=SCRAM-SHA-256"
            
            # PostgreSQL (Основная БД)
            - name: PostgresOptions__ConnectionString
              value: "Server=postgres-service-dev;Port=5432;Database=catalogs;User Id=postgres;Password=postgres;Include Error Detail=true"
            
            # PostgreSQL (Для шины сообщений Wolverine)
            - name: MessagePersistenceOptions__ConnectionString
              value: "Server=postgres-service-dev;Port=5432;Database=catalogs;User Id=postgres;Password=postgres;Include Error Detail=true"

            # RabbitMQ
            - name: WolverineBusOptions__RabbitMQConnectionString
              value: "amqp://guest:guest@rabbitmq-service-dev:5672"

            # Redis (кэш)
            - name: CacheOptions__RedisDistributedCacheOptions__ConnectionString
              value: "redis-service-dev:6379"

---
apiVersion: v1
kind: Service
metadata:
  name: catalogs-api-service
  namespace: food-delivery
spec:
  selector:
    app: catalogs-api
  ports:
    - port: 80
      targetPort: 8080
  type: ClusterIP